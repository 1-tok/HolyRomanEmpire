name: HRE v017 Large Painted Rhine Placement on Map
on:
  push:
    paths:
      - 'hre-1618/tools/render_rhine_v017_large_map_placement.py'
      - '.github/workflows/hre-v017-large-map-placement.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hre-v017-large-map-placement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Place original three large painted sections on actual HRE map
        run: python hre-1618/tools/render_rhine_v017_large_map_placement.py
      - name: Verify original artwork and separate city target QA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          r=Path('hre-1618')
          q=json.loads((r/'reports/rhine-v017-large-map-placement/qa.json').read_text())
          assert q['pixel_exact_source_reassembly'] and q['source_delta_pixels']==0
          assert q['canvas_size']==[3600,4800] and q['target_city_count']==25
          assert q['new_city_art_verified_this_build']==0
          assert not q['approved_for_300_ppi_print']
          assert Image.open(r/'maps/canvas/rhine-v017-large-painted-sections-on-map.jpg').size==(3600,4800)
          print('PASS original v017 three-piece painted art on full map. New northern and southern extensions remain pending.')
          PY
      - name: Commit full map, original assembled large layer, and review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hre-1618/maps/canvas/rhine-v017-large-painted-sections-on-map.jpg hre-1618/maps/canvas/rhine-v017-reassembled-large-painting.png hre-1618/reports/rhine-v017-large-map-placement/
          if ! git diff --cached --quiet; then
            git commit -m 'Place source-exact v017 large illustrated Rhine painting on map [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hre-v017-large-painted-rhine-map
          path: |
            hre-1618/maps/canvas/rhine-v017-large-painted-sections-on-map.jpg
            hre-1618/reports/rhine-v017-large-map-placement/
          if-no-files-found: ignore
