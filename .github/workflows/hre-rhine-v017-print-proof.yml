name: HRE Rhine v017 Print Proof and City Registration
on:
  push:
    paths:
      - 'hre-1618/tools/render_rhine_v017_print_proof.py'
      - '.github/workflows/hre-rhine-v017-print-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hre-rhine-v017-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Render high-pixel 2x reference and five geographic panels
        run: python hre-1618/tools/render_rhine_v017_print_proof.py
      - name: Validate source fidelity and explicit non-print status
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('hre-1618')
          qa=json.loads((root/'reports/rhine-v017-print-proof/qa.json').read_text())
          assert qa['reference_proof_size']==[7200,9600]
          assert qa['final_master_size']==[10800,14400]
          assert not qa['print_ready']
          assert qa['source_pixels_interpolated']
          assert not qa['genuinely_new_high_resolution_painted_pixels']
          assert qa['source_painting_sha256']=='b24dd693d513704b87fb26e7bb02eeaf771e8ef10a0a1790481940b7611e1af4'
          assert len(qa['panels'])==5 and len(qa['cities'])==25
          assert Image.open(root/'maps/canvas/rhine-v017-reference-7200x9600.jpg').size==(7200,9600)
          for p in qa['panels']:
              f=root/'reports/rhine-v017-print-proof'/p['panel_filename']
              assert f.is_file() and f.stat().st_size>10000
          print('PASS v017: native detail still requires redrawing; final production 36x48 300PPI')
          PY
      - name: Commit review-only v017 reference map and proof panels
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hre-1618/maps/canvas/rhine-v017-reference-7200x9600.jpg hre-1618/reports/rhine-v017-print-proof/
          if ! git diff --cached --quiet; then
            git commit -m 'Render v017 2x print-development reference and panel placement QA [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hre-rhine-v017-reference-print-proof
          path: |
            hre-1618/reports/rhine-v017-print-proof/
            hre-1618/maps/canvas/rhine-v017-reference-7200x9600.jpg
          if-no-files-found: ignore
