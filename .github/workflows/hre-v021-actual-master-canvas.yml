name: HRE v021 Approved Three-Sheet Print Canvas Review
on:
  push:
    branches:
      - artwork/rhine-city-batch-001
    paths:
      - 'hre-1618/assets/reference/rhine-v021-continuous-river-original.png'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hre-v021-master-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Require original approved PNG rather than procedural replacement
        run: test -s hre-1618/assets/reference/rhine-v021-continuous-river-original.png
      - name: Render v021 corrected painted strips on actual 3600 x 4800 HRE base
        run: python hre-1618/tools/render_rhine_v021_actual_master_canvas.py
      - name: Validate exact join and honest print hold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          R=Path('hre-1618')
          q=json.loads((R/'reports/rhine-v021-actual-master-canvas/qa.json').read_text())
          assert q['sheet_source_pixel_difference_count']==0
          assert q['all_sheet_x_offsets']==[0,0,0]
          assert not q['approved_for_print']
          assert not q['geographic_city_anchor_validation']
          assert Image.open(R/'maps/canvas/rhine-v021-print-master-review-3600x4800.jpg').size==(3600,4800)
          print('PASS actual HRE base map placement review; final print and historic accuracy pending')
          PY
      - name: Commit v021 actual base map preview and QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hre-1618/maps/canvas/rhine-v021-print-master-review-3600x4800.jpg hre-1618/maps/canvas/rhine-v021-unwarped-master-review-overlay.png hre-1618/reports/rhine-v021-actual-master-canvas/
          if ! git diff --cached --quiet; then
            git commit -m 'Place approved v021 three-sheet river painting on actual HRE base for print review [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hre-v021-full-actual-map-print-review
          path: |
            hre-1618/maps/canvas/rhine-v021-print-master-review-3600x4800.jpg
            hre-1618/reports/rhine-v021-actual-master-canvas/
          if-no-files-found: ignore
