name: HRE Rhine v014 Map Scale City Artwork
on:
  push:
    paths:
      - 'hre-1618/tools/render_rhine_v014_city_scale.py'
      - '.github/workflows/hre-rhine-v014-city-scale.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hre-rhine-v014-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13' 'numpy>=1.24,<3'
      - name: Render full geographic canvas and verify city and river placements
        run: python hre-1618/tools/render_rhine_v014_city_scale.py
      - name: Verify v014 output
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          r=Path('hre-1618')
          qa=json.loads((r/'reports/rhine-v014-city-scale-review/qa.json').read_text())
          assert qa['canvas_size']==[3600,4800]
          assert qa['exact_river_sprite_seams'].startswith('PASS')
          assert len(qa['cities'])==4 and qa['print_approval'] is False
          assert not qa['new_chat_painted_panels_embedded']
          assert Image.open(r/'maps/canvas/rhine-v014-full-map-painted-cities-review.jpg').size==(3600,4800)
          print('PASS v014 full map and retained historical approval gates')
          PY
      - name: Commit review map and QA to current artwork branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hre-1618/maps/canvas/rhine-v014-full-map-painted-cities-review.jpg hre-1618/maps/canvas/rhine-v014-major-city-sprites-overlay.png hre-1618/reports/rhine-v014-city-scale-review/
          if ! git diff --cached --quiet; then
            git commit -m 'Render Rhine v014 geographic city artwork review [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hre-rhine-v014-canvas-review
          path: |
            hre-1618/maps/canvas/rhine-v014-full-map-painted-cities-review.jpg
            hre-1618/reports/rhine-v014-city-scale-review/
          if-no-files-found: ignore
