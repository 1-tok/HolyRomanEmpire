name: HRE Rhine Map Progress — Original Canvas

on:
  workflow_dispatch:
  push:
    paths:
      - 'hre-1618/tools/render_rhine_progress.py'
      - 'hre-1618/tools/build_rhine_batch001.py'
      - 'hre-1618/placements/rhine-batch-001.json'
      - 'hre-1618/preview-requests/*.json'

permissions:
  contents: write

concurrency:
  group: hre-rhine-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Render continuous Rhine and city placements over original base canvas
        run: python hre-1618/tools/render_rhine_progress.py
      - name: Commit generated map-scale progress previews and connectors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hre-1618/reports/rhine-batch-001/
          if git diff --cached --quiet; then
            echo 'Preview unchanged; no commit needed'
          else
            git commit -m 'Render actual Rhine sprites and continuous connectors on HRE 1618 base [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Save independent QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hre-rhine-map-progress
          path: hre-1618/reports/rhine-batch-001/
          if-no-files-found: error
          retention-days: 30
