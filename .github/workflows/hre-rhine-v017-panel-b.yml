name: HRE Rhine v017 Panel B Mainz/Main Geospatial Painting Reference
on:
  push:
    paths:
      - 'hre-1618/tools/render_rhine_v017_panel_b_mainz.py'
      - '.github/workflows/hre-rhine-v017-panel-b.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hre-v017-mainz-panel-b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Register exact Main fork and historic city anchors for Panel B
        run: python hre-1618/tools/render_rhine_v017_panel_b_mainz.py
      - name: Confirm high-resolution reference remains review-only
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('hre-1618/reports/rhine-v017-panel-b')
          q=json.loads((root/'qa.json').read_text())
          assert q['panel_size_final_print_native_px']==[2520,1320]
          assert not q['native_original_art_pixels'] and not q['print_ready']
          assert q['geo_layer_mode'].startswith('QA only')
          for c in q['city_anchors']:
              assert 0<=c['panel_final_native_px'][0]<2520
              assert 0<=c['panel_final_native_px'][1]<1320
          assert Image.open(root/'panel-b-main-fork-geographic-qa-3x.jpg').size==(2520,1320)
          assert Image.open(root/'panel-b-v016-painting-reference-3x.jpg').size==(2520,1320)
          print('PASS Panel B geographic register — no false claim of native 300PPI painting')
          PY
      - name: Commit registered Panel B reference and QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hre-1618/reports/rhine-v017-panel-b/
          if ! git diff --cached --quiet; then
            git commit -m 'Commit v017 Mainz/Main panel registration and 3x source proof [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hre-v017-mainz-panel-b-register
          path: hre-1618/reports/rhine-v017-panel-b/
          if-no-files-found: ignore
